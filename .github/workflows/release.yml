name: 🚀 Release - Full Pipeline

# ⚙️ SETUP: Replace the two variables below after using this template
env:
  SOLUTION_FILE: csharp/MarcusMedina.Fluent.Decision.slnx        # e.g. csharp/MyPackage.slnx
  PROJECT_PATH: csharp/src/MarcusMedina.Fluent.Decision/MarcusMedina.Fluent.Decision.csproj  # e.g. csharp/src/MyPackage/MyPackage.csproj

on:
  push:
    tags: ["v*"]
    branches: [release, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: 1️⃣ Build & Test
    permissions:
      contents: read
    steps:
      - name: 🛡️ Guard — release tag must be on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A v* tag publishes regardless of branch, so refuse tags whose commit is not on main.
          # compare main...<sha>: identical|behind = on main (ok), ahead|diverged = not on main.
          status=$(gh api "repos/${{ github.repository }}/compare/main...${{ github.sha }}" --jq .status) || {
            echo "::error::Could not verify that ${GITHUB_REF_NAME} is on main - refusing to release."; exit 1; }
          echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) vs main: ${status}"
          case "$status" in
            identical|behind) ;;
            *) echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main (${status}). Merge to main via PR, then tag the commit on main."; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - run: dotnet restore ${{ env.SOLUTION_FILE }}
        name: Restore

      - run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
        name: Build

      - run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-build --verbosity normal --logger trx
        name: Test

      - run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./nupkgs
        name: Pack

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-packages
          path: ./nupkgs/*.nupkg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'

  quality-gate:
    needs: build-and-test
    runs-on: ubuntu-latest
    name: 2️⃣ Code Quality
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore ${{ env.SOLUTION_FILE }}
        name: Restore

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended,security-and-quality

      - run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
        name: Build for CodeQL

      - uses: github/codeql-action/analyze@v4
        continue-on-error: true

      - run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
        name: Dependency Vulnerability Scan
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: vulnerability-report.txt

  package-signing:
    needs: quality-gate
    runs-on: ubuntu-latest
    name: 3️⃣ Package Signing
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-packages
          path: ./unsigned

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign packages
        run: |
          for pkg in ./unsigned/*.nupkg; do
            cosign sign-blob "$pkg" \
              --bundle "${pkg}.sigstore.json" \
              --yes
          done

      - name: Generate SHA256 checksums
        run: |
          cd unsigned
          sha256sum *.nupkg > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signed-packages
          path: |
            ./unsigned/*.nupkg
            ./unsigned/*.sigstore.json
            ./unsigned/SHA256SUMS.txt

  antivirus-scan:
    needs: package-signing
    runs-on: ubuntu-latest
    name: 4️⃣ Antivirus Scan
    permissions:
      contents: read
    env:
      VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-packages
          path: ./packages

      - name: VirusTotal scan
        # Skipped in private repos: the free VirusTotal key shares uploaded files with its community
        if: env.VT_KEY != '' && !github.event.repository.private
        uses: crazy-max/ghaction-virustotal@d34968c958ae283fe976efed637081b9f9dcf74f # v4
        id: virustotal
        continue-on-error: true
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          files: ./packages/*.nupkg
          vt_monitor: false

      - name: Save scan summary
        run: |
          {
            echo "VirusTotal scan - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Outcome: ${{ steps.virustotal.outcome }}"
            echo "Analysis: ${{ steps.virustotal.outputs.analysis || 'n/a' }}"
            echo
            echo "Outcome 'skipped' means no VIRUSTOTAL_API_KEY, or the repo is private (nothing is uploaded)."
            echo
            echo "Advisory, not a hard gate - a single obscure AV engine flagging a freshly"
            echo "built .NET assembly is a common false positive. Review the analysis link"
            echo "above before publishing if the outcome is anything but a clean pass."
          } > virustotal-summary.txt
          cat virustotal-summary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: virustotal-summary.txt

  publish-nuget:
    needs: antivirus-scan
    runs-on: ubuntu-latest
    name: 5️⃣ Publish to NuGet.org
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: signed-packages
          path: ./packages

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./packages/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ./packages/*.nupkg
            ./packages/*.sigstore.json
            ./packages/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
